name: Android test APK
on:
  push:
    branches: [driver-v03-maps]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Extract V0.5 voice route preview source
        run: unzip -oq JAVIS_Driver_V0.5_Voice_Route_Preview_SOURCE.zip 'android/*' 'tools/*' -d .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android API 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x android/gradlew && cd android && ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: JAVIS-Driver-V0.5-Voice-Route-Preview
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
